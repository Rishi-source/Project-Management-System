{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Add Total Expenditure
{% endblock %}

{% block content %}
<div class="row">
  <!-- SIDEBAR -->
  <div class="col-md-2" style="box-shadow: 0px 3px 10px #bfbfbf; margin-top: -15px; height: 100%;">
    <!-- Your sidebar content -->
  </div>
  <!-- SIDEBAR END -->

  <div class="col-md-10 offset-md-2" id="messages">
    {% if error %}
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
    {% endif %}
    {% if success %}
    <div class="alert alert-success" role="alert">
      {{ success }}
    </div>
    {% endif %}
  </div>

  <!-- MAIN CONTENT -->
  <div class="col-md-10 offset-md-2">
    <div class="container-fluid">
      <h3>Add Total Expenditure :</h3><br />

      <form id="form-container" method="post" action="">
        {% csrf_token %}
        <div class="form-row">
          <div class="col-md-6 mb-3">
            <label for="id_Date">Date:</label>
            <input type="date" name="Date" id="id_Date" class="form-control" required>
          </div>
        </div>
        <div class="form-row">
          <div class="col-md-4 mb-3">
            <label for="id_Total_Expenditure">Total Expenditure (In Lacs):</label>
            <input type="number" step="0.01" name="Total_Expenditure" id="id_Total_Expenditure" class="form-control" required>
          </div>
        </div>
        <div class="form-row">
          <div class="col-md-6 mb-3">
            <a href="{% url 'projects' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-primary" id="submit-button">Add</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <!-- MAIN CONTENT END -->
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("form-container");
    const submitButton = document.getElementById("submit-button");
    const dateInput = document.getElementById("id_Date");

    function setMaxDate() {
      const today = new Date().toISOString().split('T')[0];
      dateInput.setAttribute('max', today);
    }

    function checkFormValidity() {
      const inputs = form.querySelectorAll("input[required]");
      let allFilled = true;
      inputs.forEach(input => {
        if (!input.value) {
          allFilled = false;
        }
      });

      const selectedDate = new Date(dateInput.value);
      const currentDate = new Date();
      if (selectedDate > currentDate) {
        allFilled = false;
      }

      submitButton.disabled = !allFilled;
    }

    setMaxDate();

    form.addEventListener("input", checkFormValidity);
    form.addEventListener("change", checkFormValidity);

    checkFormValidity();
  });
</script>

{% endblock %}
