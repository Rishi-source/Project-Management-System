{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
  Edit Stipulated Date Of Completion
{% endblock %}

{% block content %}
<div class="row">
  <!-- SIDEBAR -->
  <div class="col-md-2" style="box-shadow: 0px 3px 10px #bfbfbf; margin-top: -15px; height: 100%;">
  </div>
  <!-- SIDEBAR END -->

  <!-- MAIN CONTENT -->
  <div class="col-md-10">
    <div class="container-fluid">
      <h3>Edit Stipulated Date Of Completion:</h3><br />
      <div id="messages">
        {% if status %}
        <div class="alert alert-danger" role="alert">
          {{ status }}
        </div>
        {% endif %}
      </div>
    
      <form id="form-container" method="post" action="">
        {% csrf_token %}
        <div class="form-row">
          <div class="col-md-6 mb-3">
            <label for="id_Stipulated_Date">Enter Stipulated Date Of Completion:</label>
            <input type="date" name="Stipulated_Date" id="id_Stipulated_Date" class="form-control" value="{{ project.Stipulated_Date_Of_Completion }}">
          </div>
        </div>
        <div class="form-row">
          <div class="col-md-6 mb-3">
            <a href="{% url 'view_project' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-primary" id="submit-button">Update</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <!-- MAIN CONTENT END -->
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Get today's date in yyyy-mm-dd format
    let today = new Date().toISOString().split('T')[0];
    // Set the max attribute of the date input field to today's date
    document.getElementById('id_Stipulated_Date').setAttribute('max', today);
  });
</script>
{% endblock %}
