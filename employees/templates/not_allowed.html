<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        body {
            background: linear-gradient(45deg, #ff6b6b, #f06595, #007bff, #00c9ff);
            background-size: 800% 800%;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            animation: gradientAnimation 10s ease infinite;
        }

        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            text-align: center;
            color: white;
            padding: 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.7);
            animation: containerAnimation 2s ease-in-out infinite alternate;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        @keyframes containerAnimation {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.05);
            }
        }

        h1 {
            font-size: 3em;
            animation: textAnimation 2s ease-in-out infinite alternate;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        @keyframes textAnimation {
            0% {
                color: #ffeb3b;
            }
            100% {
                color: #ffffff;
            }
        }

        p {
            font-size: 1.5em;
            margin: 20px 0;
            animation: fadeIn 3s ease-in-out;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .button {
    display: inline-block;
    padding: 10px 20px;
    font-size: 1.2em;
    color: white;
    background: linear-gradient(45deg, #007bff, #00c9ff);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    text-decoration: none;
    animation: buttonAnimation 2s ease-in-out infinite alternate;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out, background 0.3s ease-in-out;
}

        @keyframes buttonAnimation {
            0% {
                background: linear-gradient(45deg, #007bff, #00c9ff);
            }
            100% {
                background: linear-gradient(45deg, #0056b3, #007bff);
            }
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
        }

        .icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }

        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            filter: blur(100px);
            animation: glowAnimation 5s infinite alternate;
        }

        @keyframes glowAnimation {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1.5);
                opacity: 1;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <br>
        <i class="fas fa-exclamation-triangle icon"></i>
        <h1>Access Denied</h1>
        <p>You are not allowed to enter this page. Please contact the site administrator.</p>
        <br>
        <a href="/dashboard" class="button">Back to Dashboard</a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            container.style.animation = 'containerAnimation 2s ease-in-out infinite alternate';
        });
    </script>
</body>
</html>
