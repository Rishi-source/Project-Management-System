<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Project Management System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/animate.css' %}">
  <style>
    /* Add your custom styles here */
    .navbar {
      box-shadow: 0px 3px 10px #bfbfbf; 
      transition: background-color 0.3s ease; 
    }
    .navbar.scrolled {
      background-color: #FFFFFF;
      color: #000000; /* Adjust text color */
    }
    .navbar-toggler {
      position: absolute;
      left: 5px;
      z-index: 1100;
    }
    .navbar-brand {
      transition: transform 0.3s ease;
    }
    .navbar-brand:hover {
      transform: scale(1.01);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">Project Management System</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              {{ user.username }} <!-- Display username or user information -->
            </a>
            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
              <a class="dropdown-item" href="{% url 'logout' %}">Logout</a>
              <a class="dropdown-item" href="{% url 'notification' %}">Notifications</a>
              <div class="dropdown-divider"></div>
              <!-- Add more dropdown items as needed -->
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="container-fluid mt-5 pt-4">
    <div class="row">
      <div class="col-md-3">
        <!-- Sidebar -->
        {% include 'partials/sidebar.html' %}
      </div>
      <div class="col-md-9">
        <!-- Main content area -->
        <div class="content">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JavaScript and additional scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    // Navbar scroll behavior
    $(document).ready(function() {
      $(window).scroll(function() {
        if ($(this).scrollTop() > 50) {
          $('.navbar').addClass('scrolled');
        } else {
          $('.navbar').removeClass('scrolled');
        }
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
