{% extends 'base.html' %}

{% block title %}
  Dashboard
{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <!-- SIDEBAR -->
    <div class="col-md-2" style="box-shadow: 0px 3px 10px #bfbfbf; margin-top: -15px; height: 100%;">
      <!-- Sidebar content here -->
    </div>
    <!-- SIDEBAR END -->

    <!-- MAIN CONTENT -->
    <div class="col-md-10 main-content">
      <div class="row mt-4">
        <div class="col-md-4">
          <a href="{% url 'view_project' %}" class="card-link">
            <div class="card text-white bg-primary mb-3 card-hover">
              <div class="card-body d-flex justify-content-center align-items-center flex-column">
                <i class="fas fa-project-diagram fa-2x mb-3"></i>
                <h5 class="card-title">Ongoing Projects</h5>
                <p class="card-text display-4">{{ ongoing_count }}</p>
              </div>
            </div>
          </a>
        </div>

        <div class="col-md-4">
          <a href="{% url 'view_project' %}" class="card-link">
            <div class="card text-white bg-success mb-3 card-hover">
              <div class="card-body d-flex justify-content-center align-items-center flex-column">
                <i class="fas fa-check-circle fa-2x mb-3"></i>
                <h5 class="card-title">Completed Projects</h5>
                <p class="card-text display-4">{{ completed_count }}</p>
              </div>
            </div>
          </a>
        </div>

        <div class="col-md-4">
          <a href="{% url 'view_project' %}" class="card-link">
            <div class="card text-white bg-warning mb-3 card-hover">
              <div class="card-body d-flex justify-content-center align-items-center flex-column">
                <i class="fas fa-handshake fa-2x mb-3"></i>
                <h5 class="card-title">Handed Over Projects</h5>
                <p class="card-text display-4">{{ handedover_count }}</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
    <!-- MAIN CONTENT END -->
  </div>
</div>

<!-- Include Font Awesome for icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">

<style>
  .card {
    box-shadow: 0px 3px 10px #bfbfbf;
    border: none;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-radius 0.3s ease;
    font-family: 'Lato', sans-serif;
    border-radius: 10px;
  }

  .card-hover:hover {
    transform: translateY(-10px);
    box-shadow: 0px 6px 15px #bfbfbf;
  }

  .card-body {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100%;
  }

  .card-title {
    font-size: 1.25rem;
    margin-bottom: 0.75rem;
    font-weight: 700;
    font-family: 'Roboto', sans-serif;
    text-align: center;
  }

  .card-text {
    font-size: 2rem;
    font-weight: 700;
    font-family: 'Lato', sans-serif;
    margin-top: 10px;
    text-align: center;
  }

  .main-content {
    transition: margin-left 0.3s ease;
    margin-left: 250px;
  }

  .card-link {
    text-decoration: none;
    color: inherit;
    display: block;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
</script>

{% endblock %}
